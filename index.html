<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invigilator</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><h1>Invigilator</h1><p>Exam deployment planner</p></div><button id="generate">✨ Generate deployment</button></header><main>
<section class="stats"><div><b id="staffCount">0</b><span>Teachers</span></div><div><b id="slotCount">0</b><span>Slots</span></div><div><b id="filledCount">0</b><span>Filled</span></div><div><b id="issueCount">0</b><span>Issues</span></div></section>
<nav><button class="tab active" data-tab="deployment">Deployment</button><button class="tab" data-tab="staff">Staff</button><button class="tab" data-tab="setup">Exam setup</button></nav>
<section id="deployment" class="panel tabpanel"><div class="toolbar"><div><h2 id="dayTitle"></h2><p id="daySubtitle"></p></div><div><button id="validate">✓ Validate</button><button id="regen">↻ Regenerate unlocked</button></div></div><div id="health" class="health"></div><div id="schedule"></div></section>
<section id="staff" class="panel tabpanel hidden"><div class="toolbar"><div><h2>Staff</h2><p>All teachers are available unless switched off.</p></div><button id="addTeacher">+ Add teacher</button></div><div id="staffList" class="staffgrid"></div></section>
<section id="setup" class="panel tabpanel hidden"><div class="toolbar"><div><h2>Exam setup</h2><p>Create and edit the exam day used by the deployment generator.</p></div><button id="addSession">+ Add exam session</button></div><div class="dayform"><label>Exam day name<input id="examName"></label><label>Date<input id="examDate" type="date"></label></div><div id="sessionEditor"></div></section>
</main><div id="toast" aria-live="polite"></div><script src="app.js"></script></body></html>
