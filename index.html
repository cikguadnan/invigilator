<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invigilator</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div><h1>Invigilator</h1><p>Exam deployment planner</p></div><button id="generate">✨ Generate deployment</button></header>
<main>
<section class="stats"><div><b id="staffCount">0</b><span>Teachers</span></div><div><b id="slotCount">0</b><span>Slots</span></div><div><b id="filledCount">0</b><span>Filled</span></div><div><b id="issueCount">0</b><span>Issues</span></div></section>
<nav><button class="tab active" data-tab="deployment">Deployment</button><button class="tab" data-tab="staff">Staff</button><button class="tab" data-tab="setup">Exam setup</button></nav>
<section id="deployment" class="panel tabpanel">
<div class="toolbar"><div><h2>24 Sept 2026 · Thursday</h2><p>Case Study 01 — English EOY</p></div><div><button id="validate">✓ Validate</button><button id="regen">↻ Regenerate unlocked</button></div></div>
<div id="health" class="health"></div><div id="schedule"></div>
</section>
<section id="staff" class="panel tabpanel hidden">
<div class="toolbar"><div><h2>Staff</h2><p>V1 assumes all teachers are available unless switched off.</p></div><button id="addTeacher">+ Add teacher</button></div>
<div id="staffList" class="staffgrid"></div>
</section>
<section id="setup" class="panel tabpanel hidden">
<h2>Exam setup</h2><p class="muted">Sample structure reconstructed from the 24 Sept deployment.</p>
<div id="sessionCards" class="sessioncards"></div>
</section>
</main>
<div id="toast" aria-live="polite"></div>
<script src="app.js"></script></body></html>
